<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Rocket Dimension Calculator</title>
    
    <!-- Google Fonts: Space Grotesk for a modern aerospace vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                    },
                    colors: {
                        base: '#050505',
                        surface: '#0f1115',
                        neon: {
                            blue: '#00f0ff',
                            purple: '#8a2be2'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 0%, #151a25 0%, #050505 75%);
            color: #e5e7eb;
            min-height: 100dvh;
        }
        
        .glass-panel {
            background: rgba(15, 17, 21, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .range-bar-container {
            position: relative;
            height: 10px;
            background: #272a35;
            border-radius: 9999px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }

        .range-bar-fill {
            position: absolute;
            height: 100%;
            background: linear-gradient(90deg, #8a2be2, #00f0ff);
            border-radius: 9999px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        /* Hide number input arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center antialiased">

    <div class="w-full max-w-4xl mx-auto relative">
        
        <!-- Language Toggle Button -->
        <div class="absolute top-0 right-0 z-10 flex gap-2">
            <button id="langToggleBtn" onclick="toggleLanguage()" class="glass-panel hover:bg-gray-800 transition-colors px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2 text-gray-300 hover:text-white border border-gray-700">
                <i class="fa-solid fa-globe text-neon-blue"></i>
                <span id="langBtnText">TR</span>
            </button>
        </div>

        <!-- Header -->
        <header class="text-center mb-10 mt-12 md:mt-4">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full glass-panel mb-4 text-neon-blue shadow-lg">
                <i class="fa-solid fa-rocket text-2xl"></i>
            </div>
            <h1 class="text-3xl md:text-5xl font-bold text-white mb-3 tracking-tight">
                <span id="titlePart1">Rocket</span><span class="text-neon-blue glow-text" id="titlePart2">Design</span>
            </h1>
            <p class="text-gray-400 max-w-xl mx-auto text-sm md:text-base" id="headerDesc">
                Enter the body tube diameter to calculate ideal dimensions for your model rocket. Optimum aerodynamic and stability ratios are calculated automatically.
            </p>
        </header>

        <!-- Input Section -->
        <div class="glass-panel rounded-2xl p-6 md:p-8 mb-8 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-neon-purple to-neon-blue"></div>
            
            <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="flex-1 text-center md:text-left">
                    <label for="diameterInput" class="block text-lg font-semibold text-gray-200 mb-1" id="inputLabel">
                        <i class="fa-solid fa-arrows-left-right text-neon-blue mr-2"></i>Body Tube Diameter (d)
                    </label>
                    <p class="text-sm text-gray-500" id="inputSub">All reference dimensions are scaled based on this diameter.</p>
                </div>
                
                <div class="relative w-full md:w-64">
                    <input type="number" id="diameterInput" value="26" min="1" step="0.1"
                        class="w-full bg-[#0a0c10] border-2 border-gray-700 text-white text-3xl font-bold rounded-xl py-3 pl-4 pr-16 focus:outline-none focus:border-neon-blue focus:ring-1 focus:ring-neon-blue transition-all shadow-inner text-center md:text-left">
                    <span class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-500 font-semibold text-lg">mm</span>
                </div>
            </div>
        </div>

        <!-- Results Grid -->
        <div class="space-y-4" id="resultsContainer">
            <!-- Items injected by JavaScript -->
        </div>
        
        <!-- Footer info -->
        <div class="mt-10 text-center text-xs md:text-sm text-gray-600 font-mono">
            <p><i class="fa-solid fa-circle-info mr-1"></i> <span id="footerText">Formulas are based on standard stability and performance rules.</span></p>
        </div>
    </div>

    <script>
        // Language state (Default is English)
        let currentLang = 'en';

        // Translation Dictionary
        const i18n = {
            en: {
                title1: "Rocket",
                title2: "Design",
                headerDesc: "Enter the body tube diameter to calculate ideal dimensions for your model rocket. Optimum aerodynamic and stability ratios are calculated automatically.",
                inputLabel: `<i class="fa-solid fa-arrows-left-right text-neon-blue mr-2"></i>Body Tube Diameter (d)`,
                inputSub: "All reference dimensions are scaled based on this diameter.",
                footerText: "Formulas are based on standard stability and performance rules.",
                langBtnToggleText: "Türkçe",
                formulaLbl: "Formula",
                idealRange: "Ideal Range",
                maxLbl: "Max",
                components: {
                    nosecone: { name: "Nose Cone Length", desc: "Minimizes aerodynamic drag." },
                    bodytube: { name: "Body Tube Length", desc: "Determines balance and weight ratio." },
                    finroot: { name: "Fin Root Length", desc: "Base length attached to the body." },
                    finspan: { name: "Fin Span", desc: "Width extending outward from the body." },
                    fintip: { name: "Fin Tip Length", desc: "The outermost edge length of the fin." },
                    staticmargin: { name: "Static Margin (CG-CP)", desc: "Critical distance to prevent tumbling." }
                }
            },
            tr: {
                title1: "Roket",
                title2: "Tasarım",
                headerDesc: "İdeal model roket parçası ölçülerinizi hesaplamak için gövde çapını girin. Optimum aerodinamik ve stabilite oranları otomatik olarak hesaplanacaktır.",
                inputLabel: `<i class="fa-solid fa-arrows-left-right text-neon-blue mr-2"></i>Gövde Dış Çapı (d)`,
                inputSub: "Tüm referans ölçüler bu çapa göre oranlanır.",
                footerText: "Formüller standart stabilite ve aerodinamik kurallarına dayanmaktadır.",
                langBtnToggleText: "English",
                formulaLbl: "Formül",
                idealRange: "İdeal Aralık",
                maxLbl: "Maks",
                components: {
                    nosecone: { name: "Burun Konisi Uzunluğu", desc: "Aerodinamik sürtünmeyi minimize eder." },
                    bodytube: { name: "Gövde Borusu Uzunluğu", desc: "Denge ve ağırlık oranını belirler." },
                    finroot: { name: "Kanatçık Kökü (Root)", desc: "Gövdeye yapışan taban uzunluğu." },
                    finspan: { name: "Kanatçık Genişliği (Span)", desc: "Gövdeden dışa doğru genişlik." },
                    fintip: { name: "Kanatçık Ucu (Tip)", desc: "Kanatçığın en dış uç uzunluğu." },
                    staticmargin: { name: "Statik Marj (CG-CP)", desc: "Roketin havada takla atmaması için kritik mesafe." }
                }
            }
        };

        // Component Formulas Data
        const componentsData = [
            { id: "nosecone", key: "nosecone", minF: 2, maxF: 5, icon: "fa-caret-up" },
            { id: "bodytube", key: "bodytube", minF: 10, maxF: 20, icon: "fa-ruler-vertical" },
            { id: "finroot", key: "finroot", minF: 1.5, maxF: 2.0, icon: "fa-grip-lines" },
            { id: "finspan", key: "finspan", minF: 1.5, maxF: 2.0, icon: "fa-arrows-alt-h" },
            { id: "fintip", key: "fintip", minF: 0.5, maxF: 0.75, icon: "fa-compress-alt" },
            { id: "staticmargin", key: "staticmargin", minF: 1.0, maxF: 2.0, icon: "fa-balance-scale" }
        ];

        // DOM Elements
        const resultsContainer = document.getElementById('resultsContainer');
        const diameterInput = document.getElementById('diameterInput');

        // Update Static Texts based on selected language
        function updateStaticTexts() {
            const lang = i18n[currentLang];
            document.getElementById('titlePart1').innerText = lang.title1;
            document.getElementById('titlePart2').innerText = lang.title2;
            document.getElementById('headerDesc').innerText = lang.headerDesc;
            document.getElementById('inputLabel').innerHTML = lang.inputLabel;
            document.getElementById('inputSub').innerText = lang.inputSub;
            document.getElementById('footerText').innerText = lang.footerText;
            document.getElementById('langBtnText').innerText = lang.langBtnToggleText;
        }

        // Render UI component cards
        function renderUI() {
            updateStaticTexts();
            resultsContainer.innerHTML = ''; // Clear container
            const lang = i18n[currentLang];
            
            componentsData.forEach(comp => {
                const compText = lang.components[comp.key];
                const scaleMax = comp.maxF * 1.2; // 20% larger than max for visual padding
                const leftPercent = (comp.minF / scaleMax) * 100;
                const widthPercent = ((comp.maxF - comp.minF) / scaleMax) * 100;

                const cardHTML = `
                    <div class="glass-panel rounded-xl p-5 hover:bg-[#151821] transition-colors duration-300 border border-transparent hover:border-gray-800">
                        <div class="flex flex-col md:flex-row md:items-center justify-between mb-4">
                            
                            <div class="flex items-center mb-3 md:mb-0">
                                <div class="w-10 h-10 rounded-lg bg-[#0a0c10] flex items-center justify-center text-neon-blue mr-4 shadow-lg border border-gray-800">
                                    <i class="fa-solid ${comp.icon}"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-base md:text-lg text-gray-200">${compText.name}</h3>
                                    <p class="text-[11px] md:text-xs text-gray-500">${compText.desc}</p>
                                </div>
                            </div>

                            <div class="text-left md:text-right flex-shrink-0 ml-[56px] md:ml-0">
                                <div class="text-xl md:text-2xl font-bold text-white tracking-wider" id="val-${comp.id}">
                                    -- <span class="text-sm font-normal text-gray-500">mm</span>
                                </div>
                                <div class="text-xs text-neon-blue font-semibold tracking-wide mt-1">
                                    ${lang.formulaLbl}: ${comp.minF}d - ${comp.maxF}d
                                </div>
                            </div>
                        </div>

                        <!-- Visual Range Bar -->
                        <div class="relative pt-2 pl-[56px] md:pl-0">
                            <div class="flex justify-between text-[10px] text-gray-600 mb-1 font-mono uppercase tracking-wider">
                                <span>0</span>
                                <span>${lang.idealRange}</span>
                                <span>${lang.maxLbl}</span>
                            </div>
                            <div class="range-bar-container">
                                <div class="range-bar-fill opacity-80 hover:opacity-100" 
                                     style="left: ${leftPercent}%; width: ${widthPercent}%;">
                                </div>
                            </div>
                            <!-- Dynamic value markers (Min / Max) -->
                            <div class="absolute w-full h-full top-0 left-0 pointer-events-none mt-[25px] pl-[56px] md:pl-0">
                                <div class="absolute text-[11px] text-gray-300 font-medium transform -translate-x-1/2" 
                                     style="left: ${leftPercent}%;" id="min-lbl-${comp.id}"></div>
                                <div class="absolute text-[11px] text-gray-300 font-medium transform -translate-x-1/2" 
                                     style="left: ${(comp.maxF / scaleMax) * 100}%;" id="max-lbl-${comp.id}"></div>
                            </div>
                        </div>
                    </div>
                `;
                resultsContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Calculate and update values based on input
        function calculate() {
            let d = parseFloat(diameterInput.value);
            
            if (isNaN(d) || d <= 0) d = 0;

            componentsData.forEach(comp => {
                const valElement = document.getElementById(`val-${comp.id}`);
                const minLblElement = document.getElementById(`min-lbl-${comp.id}`);
                const maxLblElement = document.getElementById(`max-lbl-${comp.id}`);

                if (d === 0) {
                    valElement.innerHTML = `-- <span class="text-sm font-normal text-gray-500">mm</span>`;
                    minLblElement.innerText = '';
                    maxLblElement.innerText = '';
                    return;
                }

                // Calculate minimum and maximum values
                // Using max(0, decimals) to format nicely, removing trailing zeros if integer
                const minVal = parseFloat((d * comp.minF).toFixed(2));
                const maxVal = parseFloat((d * comp.maxF).toFixed(2));

                // Update text displays
                valElement.innerHTML = `${minVal} - ${maxVal} <span class="text-sm font-normal text-gray-500">mm</span>`;
                minLblElement.innerText = minVal;
                maxLblElement.innerText = maxVal;
            });
        }

        // Language Toggle Function
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'tr' : 'en';
            renderUI();
            calculate();
        }

        // Initialize UI and attach event listeners on load
        window.addEventListener('DOMContentLoaded', () => {
            renderUI(); // Initial render in English
            calculate(); // Run initial calculation

            // Listen for user input events
            diameterInput.addEventListener('input', calculate);
        });

    </script>
</body>
</html>
