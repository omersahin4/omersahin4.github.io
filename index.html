<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Rocket Dimensions Calculator</title>
    
    <!-- Google Fonts: Inter for clean UI, JetBrains Mono for tech vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        base: '#050505',
                        surface: '#0a0a0a',
                        surfaceHover: '#111111',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            color: #ededed;
            /* Ensures mobile scrolling without clipping */
            min-height: 100dvh; 
            /* Subtle dot pattern for engineering/blueprint feel */
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* Tech button hover effects */
        .tech-btn {
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        .tech-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background-color: #111111;
            transform: translateY(-4px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
        }

        .tech-btn .tech-status {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease-out;
        }

        .tech-btn:hover .tech-status {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center p-6 md:p-12 relative overflow-x-hidden">

    <!-- Ambient Glow (Subtle) -->
    <div class="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-white opacity-[0.01] blur-[100px] pointer-events-none"></div>

    <div class="w-full max-w-5xl mx-auto flex flex-col items-center relative z-10 py-12 md:py-20">
        
        <header class="text-center mb-16 md:mb-24 w-full">
            <div class="inline-block mb-4 px-3 py-1 border border-gray-800 rounded-full bg-surface">
                <span class="font-mono text-[10px] text-gray-500 tracking-widest uppercase">System Status: Online</span>
            </div>
            <h1 class="text-3xl md:text-5xl lg:text-6xl font-semibold tracking-tight text-white mb-4">
                Model Rocket
                <span class="block text-gray-500 font-light mt-2 md:mt-4">Dimensions Calculator</span>
            </h1>
            <p class="text-gray-400 mt-6 font-light">Select an engine/module to begin</p>
            <div class="w-16 h-[1px] bg-gray-800 mx-auto mt-8"></div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8 w-full">
            
            <!-- Gemini Engine Button -->
            <a href="gemini.html" class="tech-btn block border border-gray-800/60 bg-surface rounded-2xl p-8 md:p-10 relative overflow-hidden group cursor-pointer">
                <div class="flex flex-col h-full justify-between min-h-[140px]">
                    <div>
                        <div class="w-2 h-2 rounded-full bg-gray-700 group-hover:bg-blue-400 transition-colors mb-6 duration-500"></div>
                        <h2 class="text-2xl font-medium text-gray-200 group-hover:text-white transition-colors">Gemini</h2>
                    </div>
                    <div class="tech-status mt-6">
                        <p class="font-mono text-[11px] text-blue-400 uppercase tracking-widest">
                            > MTR_ACTIVATE: GMN-01
                        </p>
                    </div>
                </div>
                <!-- Corner accent -->
                <div class="absolute top-0 right-0 w-8 h-8 border-t border-r border-transparent group-hover:border-blue-500/30 transition-colors opacity-0 group-hover:opacity-100 rounded-tr-2xl"></div>
            </a>

            <!-- Claude Engine Button -->
            <a href="claude.html" class="tech-btn block border border-gray-800/60 bg-surface rounded-2xl p-8 md:p-10 relative overflow-hidden group cursor-pointer">
                <div class="flex flex-col h-full justify-between min-h-[140px]">
                    <div>
                        <div class="w-2 h-2 rounded-full bg-gray-700 group-hover:bg-amber-500 transition-colors mb-6 duration-500"></div>
                        <h2 class="text-2xl font-medium text-gray-200 group-hover:text-white transition-colors">Claude</h2>
                    </div>
                    <div class="tech-status mt-6">
                        <p class="font-mono text-[11px] text-amber-500 uppercase tracking-widest">
                            > MTR_ACTIVATE: CLD-03
                        </p>
                    </div>
                </div>
                <!-- Corner accent -->
                <div class="absolute top-0 right-0 w-8 h-8 border-t border-r border-transparent group-hover:border-amber-500/30 transition-colors opacity-0 group-hover:opacity-100 rounded-tr-2xl"></div>
            </a>

            <!-- ChatGPT Engine Button -->
            <a href="chatgpt.html" class="tech-btn block border border-gray-800/60 bg-surface rounded-2xl p-8 md:p-10 relative overflow-hidden group cursor-pointer">
                <div class="flex flex-col h-full justify-between min-h-[140px]">
                    <div>
                        <div class="w-2 h-2 rounded-full bg-gray-700 group-hover:bg-green-500 transition-colors mb-6 duration-500"></div>
                        <h2 class="text-2xl font-medium text-gray-200 group-hover:text-white transition-colors">ChatGPT</h2>
                    </div>
                    <div class="tech-status mt-6">
                        <p class="font-mono text-[11px] text-green-500 uppercase tracking-widest">
                            > MTR_ACTIVATE: GPT-04
                        </p>
                    </div>
                </div>
                <!-- Corner accent -->
                <div class="absolute top-0 right-0 w-8 h-8 border-t border-r border-transparent group-hover:border-green-500/30 transition-colors opacity-0 group-hover:opacity-100 rounded-tr-2xl"></div>
            </a>

        </div>
    </div>

</body>
</html>
